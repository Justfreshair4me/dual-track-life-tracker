name: Lock experimental model snapshots
on:
  workflow_dispatch:
  push:
    branches: [experiment/local-audio-benchmark]
    paths: [.github/workflows/benchmark-model-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: python3 experiments/transcription-benchmark/scripts/models.py lock
      - name: Commit public model metadata only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/transcription-benchmark/models.lock.json
          git commit -m 'Pin benchmark model snapshots and verified download sizes'
          git push origin HEAD:${{ github.ref_name }}
